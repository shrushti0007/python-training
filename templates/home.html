<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <title>College portal</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
    <meta name="viewport" content="width=device-width, inittial-scale=1.0">
    <title>{% block title %}College Portal{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/boostrap.min.css" rel="stylesheet">

    <!-- Custom brand color - ek line se poori site ka color change -->
    <style>
         :root{
              --brand: #le3a5f;
         }
         .navbar-brand-custom { background-color: var(--brand);}
         .btn-brand { 
              background-color: var(--brand);
              color: white;
              border: none;
        }
        .btn-brand:hover { background-color: #162d4a; color: White; }
        .hero-section {
            background: linear-gradient(135deg, #1e3a5f 0%, #2d6a9f 100%);
            color: white;
            border-radius: 12px;
        }
        .stat-Card {
             border: none;
             border-radius: 12px;
             transition: transform 0.2s; 
        }  
        .stat-card:hover { transform: translateY(-3px); }
        .student-Card {
             border: none;
             border-radius: 12px;
             box-shadow: 0.2px 8px ◻rgba(0,0,0,0.08);
             transition: transform 0.2s, box-shadow 0.2s;
        }
        .student-card:hover {
             transform: translateY(-4px);
             box-shadow: 0 6px 20px ◻rgba(0,0,0,0.12);
        }
    </style>
<script src="https:"//cdn.Jsdelivr.net/npm/bootstrap@5.3.0/dist/Js/bootstrap.bundle.min.js"></script>

<body class="bg-light">

    <!-- Professional Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm"...
            style="background-color: ◻#1e3a5f;">
            <div class="container-fluid">

              <!-- Brand / Logo -->
              <a class="navbar-brand fw-bold fs-4" href="{{ url_for('home') }}">
                  🎓College portal 
              </a>

              <!-- Mobile toggle -->
              <button class="navbar-toggle" type="button"
                           data-bs-toggle="collapse"
                           data-bs-target="#navbarNav">
                       <span class="navbar-toggler-icon"></span>
                     </button>

                     <!-- Nav link -->
                     <div class="Collapse navbar-collapse" id="navbarNav">
                         <div class="navbar-nav ms-auto">
                            <a class="nav-link px-3" href="#">
                               🏠Home    
                            </a>
                            <a class="nav-Link px-3" href="#">
                                 🧑‍🎓 Students
                                </a>
                                <a class="nav-link px-3" href="#">
                                     ℹ️ About
                                    </a>
                                   </div>
                                  </div>

                             </div>
                        </nav>

                        <!-- Page content -Inside container -->
                        <div class="Container mt-4 mb-5">
                             {% block content %}
                             {% endblock %}
                        </div>

                        <!-- Professional Footer -->
                        <footer style="background-color: ◻#1e3a5f;" class="text-center py-3 mt-5"
                            <small>
                               🎓College Portal &nbsp;|&nbsp;
                               Built with python + Flask + Bootstrap &nbsp;|&nbsp;
                               Linkkiwi Software Services
                            </small>
                        </footer>

                        <!-- Bootstrap JS -->
                        <script src="https://cdn.jsdeLive.net/npm/bootstrap@5.3.0/dist/JS/bootstrap.boundle.min."

body>
<html></html>
