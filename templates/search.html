 <!DOCTYPE html>
<html>
<head>
    <title>Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">

    <h3>Search Students</h3>

    <form method="GET" action="{{ url_for('search') }}">
        <input type="text" name="q" class="form-control mb-3"
               placeholder="Search here..." value="{{ query }}">
    </form>

    <table class="table table-bordered">
        <tr>
            <th>Name</th>
            <th>Roll</th>
            <th>Marks</th>
            <th>Subject</th>
        </tr>

        {% for s in students %}
        <tr>
            <td>{{ s['name'] }}</td>
            <td>{{ s['roll'] }}</td>
            <td>{{ s['marks'] }}</td>
            <td>{{ s['subject'] }}</td>
        </tr>
        {% endfor %}

    </table>

</div>

</body>
</html>
