<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Bootstrap Grid Demo
</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">



<style>


body{

    background:#f5f7fb;

}


.box{

    background:#1e3a5f;

    color:white;

    padding:20px;

    margin-bottom:10px;

    border-radius:8px;

    text-align:center;

    font-weight:bold;

    transition:0.3s;

}



.box:hover{

    transform:translateY(-5px);

}


</style>


</head>



<body class="p-4">



<div class="container">


<h2 class="text-center mb-4 fw-bold">

🎓 Bootstrap Grid Demo

</h2>





<!-- STEP 1 : Full Width -->


<div class="row mb-3">


<div class="col-md-12">


<div class="box">

Full Width (100%)

</div>


</div>


</div>








<!-- STEP 2 : Two Columns -->


<div class="row mb-3">


<div class="col-md-6">


<div class="box">

Column 1 (50%)

</div>


</div>





<div class="col-md-6">


<div class="box">

Column 2 (50%)

</div>


</div>


</div>









<!-- STEP 3 : Three Columns -->


<div class="row mb-3">


<div class="col-md-4">


<div class="box">

Column 1 (33%)

</div>


</div>





<div class="col-md-4">


<div class="box">

Column 2 (33%)

</div>


</div>





<div class="col-md-4">


<div class="box">

Column 3 (33%)

</div>


</div>



</div>









<!-- STEP 4 : Uneven Split -->


<div class="row mb-3">


<div class="col-md-3">


<div class="box">

25%

</div>


</div>





<div class="col-md-6">


<div class="box">

50%

</div>


</div>





<div class="col-md-3">


<div class="box">

25%

</div>


</div>



</div>





</div>


</body>


</html>
