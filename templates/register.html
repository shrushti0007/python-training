{% extends 'base.html' %}

{% block title %}
Register — Government Polytechnic Hingoli
{% endblock %}


{% block content %}

<div class="row justify-content-center">

<div class="col-md-5">


<div class="card shadow-lg border-0">


<!-- Header -->

<div class="card-header text-white text-center py-3"
style="background:#1e3a5f;">

<h4 class="mb-1">
🎓 Create Account
</h4>

<small>
Government Polytechnic Hingoli
</small>

</div>




<div class="card-body p-4">


<div class="text-center mb-3">

<div class="rounded-circle mx-auto d-flex align-items-center justify-content-center"

style="
width:70px;
height:70px;
background:#2d6a9f;
color:white;
font-size:32px;
">

📝

</div>

</div>




<h5 class="text-center fw-bold mb-4">

Student Registration

</h5>




<form method="POST" action="{{ url_for('register') }}">



<div class="mb-3">

<label class="form-label fw-bold">
Username
</label>


<div class="input-group">

<span class="input-group-text">
👤
</span>


<input type="text"
name="username"
class="form-control"
placeholder="Create username"
required>


</div>

</div>





<div class="mb-3">


<label class="form-label fw-bold">
Password
</label>


<div class="input-group">

<span class="input-group-text">
🔒
</span>


<input type="password"
name="password"
class="form-control"
placeholder="Create password"
required>


</div>


</div>





<div class="d-grid">


<button type="submit"
class="btn btn-lg"
style="
background:#1e3a5f;
color:white;
">

Register

</button>


</div>




</form>




<hr>



<p class="text-center mb-0">

Already have an account?

<a href="{{ url_for('login') }}"
class="fw-bold">

Login Here

</a>


</p>




</div>


</div>


</div>


</div>


{% endblock %}
