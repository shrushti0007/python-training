<!DOCTYPE html>
<html>

<head>
    <title>JavaScript Test</title>
</head>


<body>


<h1 id="myHeading">
    Hello
</h1>


<!-- JavaScript will change heading text when button is clicked -->


<button id="mybutton">
    Click Me
</button>





<script>


// Step 1: Select heading element using ID

const heading = document.getElementById("myHeading");


// Step 2: Select button element

const button = document.getElementById("mybutton");



// Step 3: Add click event

button.addEventListener("click", function(){


    heading.textContent = "Welcome to JavaScript!";


});



</script>



</body>

</html>
