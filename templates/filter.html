 <!DOCTYPE html>
<html>
<head>
    <title>Filter Students</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">

    <h2 class="mb-4">Filter Students</h2>

    <form method="GET" action="{{ url_for('filter_students') }}" class="row g-3 mb-4">

        <div class="col-md-5">
            <label class="form-label">Subject</label>
            <select name="subject" class="form-select">
                <option value="">All Subjects</option>

                {% for sub in subjects %}
                <option value="{{ sub['subject'] }}"
                    {% if selected_subject == sub['subject'] %}selected{% endif %}>
                    {{ sub['subject'] }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="col-md-5">
            <label class="form-label">Grade</label>
            <select name="grade" class="form-select">
                <option value="">All Grades</option>
                <option value="excellent" {% if selected_grade=='excellent' %}selected{% endif %}>Excellent (90+)</option>
                <option value="good" {% if selected_grade=='good' %}selected{% endif %}>Good (75-89)</option>
                <option value="average" {% if selected_grade=='average' %}selected{% endif %}>Average (60-74)</option>
                <option value="poor" {% if selected_grade=='poor' %}selected{% endif %}>Poor (&lt;45)</option>
            </select>
        </div>

        <div class="col-md-2 d-grid">
            <label class="form-label">&nbsp;</label>
            <button type="submit" class="btn btn-primary">
                Filter
            </button>
        </div>

    </form>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Roll</th>
                <th>Marks</th>
                <th>Subject</th>
                <th>Attendance</th>
            </tr>
        </thead>

        <tbody>
        {% for student in students %}
            <tr>
                <td>{{ student['id'] }}</td>
                <td>{{ student['name'] }}</td>
                <td>{{ student['roll'] }}</td>
                <td>{{ student['marks'] }}</td>
                <td>{{ student['subject'] }}</td>
                <td>{{ student['attendance'] }}</td>
            </tr>
        {% else %}
            <tr>
                <td colspan="6" class="text-center">No students found.</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>

    <a href="{{ url_for('home') }}" class="btn btn-secondary">
        Back to Home
    </a>

</div>

</body>
</html>
