<!DOCTYPE html>
<html>
    <head>
        <title>{% block title %} College Portal {% endblock %}</title>

        <!-- Bootstrap CS -->

        <link href="https://cdn.jsdelive.net/npm/bootstrap@5.3.0.dist/css/bootstrap"
        rel="stylesheet">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-light bg-primary">
            <div class="container">
            <a class="navbar-brand" href="{{ url_for('home') }}">College Portal</a>
            <div class="navbar-nav ms-auto">
            <a href="{{ url_for('students') }}">Students</a>
            <a href="{{ url_for('courses') }}">Courses</a>
            <a href="{{ url_for('about') }}">About</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
    </div>

    <hr>

    {% block content %}
    {% endblock %}
<hr>
<small>College Portal- Built Flask Python </small>
</body>
</html>
