{% extends "base.html" %}


{% block title %}
Edit Student — Government Polytechnic Hingoli
{% endblock %}



{% block content %}



<div class="container mt-4">



    <div class="d-flex justify-content-between align-items-center mb-3">


        <h2>

            <i class="bi bi-pencil-square"></i>

            Edit Student

        </h2>




        <a href="/students" class="btn btn-secondary">


            <i class="bi bi-arrow-left"></i>

            Back to Students


        </a>


    </div>





    <div class="card shadow">



        <div class="card-header">


            <h5 class="mb-0">

                Update Student Information

            </h5>


        </div>





        <div class="card-body">



            
                  <form method="POST" action="{{ url_for('edit_student', id=student['id']) }}"></form>





                <div class="row">



                    <div class="col-md-6 mb-3">


                        <label class="form-label">

                            Student Name

                        </label>



                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            value="{{ student['name'] }}"
                            required>


                    </div>
                    
                    <div class="col-md-6 mb-3">


                        <label class="form-label">

                            Roll Number

                        </label>



                        <input
                            type="text"
                            name="roll"
                            class="form-control"
                            value="{{ student['roll'] }}"
                            required>


                    </div>





                    <div class="col-md-6 mb-3">


                        <label class="form-label">

                            Subject

                        </label>



                        <input
                            type="text"
                            name="subject"
                            class="form-control"
                            value="{{ student['subject'] }}"
                            required>


                    </div>





                    <div class="col-md-6 mb-3">


                        <label class="form-label">

                            Marks

                        </label>



                        <input
                            type="number"
                            name="marks"
                            class="form-control"
                            value="{{ student['marks'] }}"
                            required>


                    </div>





                    <div class="col-md-6 mb-3">


                        <label class="form-label">

                            Attendance

                        </label>



                        <input
                            type="number"
                            name="attendance"
                            class="form-control"
                            value="{{ student['attendance'] }}"
                            required>


                    </div>
                    
                </div>



                <div class="text-center mt-3">



                    <button
                        type="submit"
                        class="btn btn-success">


                        <i class="bi bi-check-circle"></i>

                        Update Student


                    </button>





                    <a href="/students"
                       class="btn btn-secondary">


                        <i class="bi bi-x-circle"></i>

                        Cancel


                    </a>



                </div>




            </form>



        </div>



    </div>



</div>



{% endblock %}
